# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: linkpulse

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: linkpulse
    main: ./cmd/linkpulse
    binary: linkpulse
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

# Homebrew tap. The cask is only pushed when HOMEBREW_TAP_GITHUB_TOKEN is set
# (a token with write access to marcus-girolneto/homebrew-tap), so releases
# succeed before the tap repository exists. Pre-releases are never pushed.
homebrew_casks:
  - name: linkpulse
    repository:
      owner: marcus-girolneto
      name: homebrew-tap
      token: '{{ envOrDefault "HOMEBREW_TAP_GITHUB_TOKEN" "" }}'
    directory: Casks
    homepage: https://github.com/marcus-girolneto/linkpulse
    description: Fast, concurrent broken-link checker for websites and CI pipelines
    license: MIT
    commit_msg_template: "linkpulse {{ .Tag }}"
    skip_upload: '{{ if envOrDefault "HOMEBREW_TAP_GITHUB_TOKEN" "" }}auto{{ else }}true{{ end }}'
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/linkpulse"]
          end

release:
  github:
    owner: marcus-girolneto
    name: linkpulse
  draft: false
  prerelease: auto
